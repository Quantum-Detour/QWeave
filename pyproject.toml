[project]
name = "qweave"
version = "0.1.0"
description = "Quantum multipath routing research platform"
readme = "README.md"
authors = [
    { name = "Bhaskar Mahajan", email = "bhaskarmahajan98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hypertiling>=1.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "scipy>=1.18.1",
]

[project.scripts]
qweave = "qweave.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
